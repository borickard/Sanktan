<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      .wm { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 800; letter-spacing: -0.03em; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- Logo + wordmark row (centered horizontally around y=295) -->
  <g transform="translate(285, 160)">
    <!-- Stopwatch -->
    <g>
      <circle cx="80" cy="100" r="80" fill="#0a0a0a"/>
      <rect x="58" y="0" width="44" height="26" rx="4" fill="#0a0a0a"/>
      <line x1="80" y1="26" x2="80" y2="40" stroke="#0a0a0a" stroke-width="18" stroke-linecap="round"/>
      <line x1="80" y1="100" x2="120" y2="60" stroke="#facc15" stroke-width="20" stroke-linecap="round"/>
      <circle cx="80" cy="100" r="12" fill="#ffffff"/>
    </g>
    <!-- Wordmark Speltid, baseline aligned with stopwatch body center -->
    <text x="190" y="145" class="wm" font-size="180" fill="#0a0a0a">Speltid</text>
  </g>

  <!-- Tagline -->
  <text x="600" y="410" class="mono" font-size="28" fill="#525252" letter-spacing="2" text-anchor="middle">MATCHPLANERARE &#183; UNGDOMSFOTBOLL</text>

  <!-- Yellow pill (format badge) -->
  <g transform="translate(545, 450)">
    <rect x="0" y="0" width="110" height="48" rx="8" fill="#facc15" stroke="#0a0a0a" stroke-width="3"/>
    <text x="55" y="33" class="mono" font-size="24" fill="#0a0a0a" font-weight="700" text-anchor="middle" letter-spacing="2">5v5</text>
  </g>
</svg>
